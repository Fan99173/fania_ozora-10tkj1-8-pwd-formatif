<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tombol</title>
<style>
    body {
        background-color: #e3f2ff;
        font-family: Arial, sans-serif;
    }

    h2 {
        color: midnightblue;
        font-size:20px;
    
    }

    .btn {
        display:inline-block;
        padding:12px 24px;
        border-radius: 8px;
        font-weight:bold;
        text-decoration: none;
        cursor: pointer;
    }

    .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
    }

    .btn-primary {
            background-color: #1e3a6e;
            color: white;
    }

    .btn-secondary {
    background-color: rgb(207, 216, 234);
    }

    .btn-outline {
    background-color:white;
    border: 2px solid #1e3a6e;
    }

    .btn-send {
    background-color: rgb(37, 99, 180);
    color: white;
    }

    .btn-secondary, .btn-outline {
    color: #1a1a2e;
    }

    .btn-primary:hover {
            background-color: #0e1e3c;
    }

    .btn-secondary:hover {
            background-color: rgb(161, 193, 228);
    }

    .btn-outline:hover {
            background-color: rgba(196, 214, 252, 0.5);
    }

    .btn-send:hover {
            background-color: rgb(24, 86, 166);
    }
</style>
</head>
<body>
    <main>
        <h2>Kumpulan Tombol</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>
<footer>
    <a href="../index.html">Kembali ke Beranda</a>
</footer>
</body>
</html>
