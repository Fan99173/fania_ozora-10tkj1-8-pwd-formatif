<!--
Hitungan lebar kartu jika box-sizing tidak diatur:
lebar elemen = lebar konten + padding + border
lebar elemen = 320px + 20px +20px + 2px + 2px = 364px
kalau dengan box-sizing: border-box dan lebar kartu tetap 320px.

-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f3e4ff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #314a77;
            margin: 30px auto; /*agar ditengah*/
            background-color: white;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit:cover; /**gambar tidak gepeng pas dilebarkan**/
        }

        .card h3 {
            color: midnightblue;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
            color: #193a5f;
        }

        .card a {
            font-size: 15px;
            color: #ef9c28;
        }

        footer {
            text-align: center;
        }
    </style>
</head>

<body>
    <main>
        <div class="card">
            <img src="../assets/images/card-drawing.jpeg" alt="Gambar Hobi proyek">
            <h3>Porfolio Bagian Hobi</h3>
            <p>Proyek latihan membuat halaman profil dan portofolio. Dibuat bagian Hobi yaitu menggambar, mendesain poster, dan bermain drum menggunakan HTML dan CSS.</p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>
    <footer>
        <a href='../index.html'>Kembali ke Beranda</a>
    </footer>
</body>
</html>
